# =============================================================================
# FineBI 6.1 —— 三容器分析模式（web + engine-master + engine-worker）
# -----------------------------------------------------------------------------
# 这个文件是独立的 compose，与 docker-compose.yml 互不影响：
#   起：docker compose -f docker-compose.finebi.yml up -d
#   停：docker compose -f docker-compose.finebi.yml down
# 用 scripts/switch-mode.sh 切换更省事（它会顺手算内存账）。
#
# -----------------------------------------------------------------------------
# 一、拓扑
# -----------------------------------------------------------------------------
#   rt-finebi          bi-web             172.28.0.30  宿主 9080 -> 8080
#   rt-finebi-master   bi-engine-master   172.28.0.31  :8000
#   rt-finebi-worker   bi-engine-worker   172.28.0.32  :9001（自己带 monitor :9000）
#
#   三者通过 rt-net 用固定 IP 互访。web 是 Tomcat 入口，master 是调度/元数据，
#   worker 是真正算数的引擎。页面上的「部署向导 → 引擎」这一步，等的就是
#   master 在 8000 上应答。
#
# -----------------------------------------------------------------------------
# 二、为什么必须是三个容器
# -----------------------------------------------------------------------------
#   FineBI 6.x 的 polars 引擎是**独立进程 + 独立发行包**，不是 web 里的一个模块：
#
#     镜像                   WEB-INF/lib 内容                     JDK
#     bi-web                 37 个 jar，含 polars-**client** 141MB  Java 8
#     bi-engine-master        6 个 jar，含 polars-**实现** 357MB     Java 11
#     bi-engine-worker        6 个 jar，同上（与 master 完全一致）    Java 11
#
#   两张 lib 是**两套类**：client 只有 RPC 桩和协议，实现在另外 357MB 里。
#   之前把 357MB 的实现 jar 塞进 web 的 37 个 jar 里，直接
#   `UnsupportedClassVersionError: class 55.0 vs 52.0` —— 因为那两个 jar
#   是不同 JDK 编的。**这不是打包缺漏，是 Java 版本边界。**
#
#   所以：master / worker 各自用**镜像自带**的 lib，绝不去挂 web 的卷。
#   脚本里 BI_JAR_HOME 默认就是自己容器内的
#   /usr/local/tomcat/webapps/webroot/WEB-INF/lib/*，正好命中那 6 个 jar。
#   **不要设 BI_JAR_HOME**，让它走默认。
#
# -----------------------------------------------------------------------------
# 三、为什么不需要 MinIO
# -----------------------------------------------------------------------------
#   polars 的存储层有三档，由 ENV_POLARS_TIERS 选：
#     sync（默认）  节点间直接传数据，不落共享存储  ← 本项目用这个
#     s3v2          需要 MinIO/S3（finekey 企业版默认）
#     nas           需要 NFS
#
#   官方推荐 s3v2 是因为它在多机、大数据量、worker 可弹性伸缩的场景下
#   需要一份共享数据面。我们 11 万行、单 worker，sync 完全够，而且
#   省掉一个 MinIO 容器（约 300MB）。
#
# -----------------------------------------------------------------------------
# 四、为什么不用 OPS_URL（监控子进程）
# -----------------------------------------------------------------------------
#   startup.sh 里有个分支：
#     OPS_URL 非空 → 额外拉起 process agent（crash 监控），再起引擎
#     OPS_URL 为空 → 直接起引擎
#   finekey 企业版会注入 OPS_URL 指向 ops-tomcat，那样每个引擎容器会多
#   一个 -Xmx256m 的监控 JVM。我们不做运维监控，**不设 OPS_URL**，
#   省一个进程也少一处失败点。
#
#   但 worker 自己还会起一个 monitor：
#     PolarsMonitorServer（-Xmx256M，端口 9000）负责看护 worker 进程
#     worker（WORKER_EXTRA_VM_OPTIONS 指定的堆，端口 9001）
#   这个 monitor 去不掉，是 polars 的看护模型，所以要给它留内存。
#
# -----------------------------------------------------------------------------
# 五、内存账（Docker VM 实见 9947MB）
# -----------------------------------------------------------------------------
#   doris-fe              1536
#   doris-be              1792
#   rt-finebi（web）      7808   ← 见文件后半「为什么是 7808」
#   rt-finebi-master      2048   ← Xmx768 + 脚本硬编码的直接内存上限 2G
#   rt-finebi-worker      3584   ← monitor 256 + worker Xmx2048 + 元空间/栈
#   --------------------------------
#   限额合计             16768MB   ← 纸面超卖 6.8GB，靠实测兜底
#
#   mem_limit 是**保险丝不是预占**。上一轮单容器实测：
#     fe 657 + be 1514 + web 1586 = 3757MB，VM 里还剩 5669MB。
#   master 空载约 400MB、worker 空载约 800MB，五容器实测合计约 5GB。
#   纸面超卖看着吓人，但要真正吃满得同时触发五个容器的峰值，这台机器
#   的负载（静态快照 + 单用户）不会有那种时刻。
#
#   如果以后要压，第一刀砍 web 的 MAXDirect/MAXMetaspace（实测这两项
#   只用到 132MB / 18MB），能把 7808 压到 3456 左右。但这会动 FineBI 的
#   启动自检判据，得单独验一轮，不在这次范围里。
#
# -----------------------------------------------------------------------------
# 六、为什么 worker 的 Xmx 不能小（这是踩出来的）
# -----------------------------------------------------------------------------
#   第一版给 worker 配 -Xmx1024m，容器 25 秒后 exit 255，日志里：
#
#     IllegalArgumentException: The memory size for polars too small : -198642237
#         at ResourcePlate.start0(ResourcePlate.java:133)
#
#   值是**负数**。反编译 fine-bi-engine-polars-6.1.jar 之后才看明白：
#
#     polars.core.memory.system.max.size
#       默认值 = 单进程 JVM 堆上限（Xmx），作用说明是
#       「Polars 认为的可使用的内存上限 默认单进程的JVM堆内上限」
#     polars.core.memory.system.reserve.radio = 0.12
#       「为系统预留的内存大小，从系统内存中扣除」
#     polars.spark.memory.ratio = 0.4，且 Math.max(ratio×上限, SPARK_MEMORY_MIN)
#       SPARK_MEMORY_MIN 实测 1GB —— 这一项是**下限 1GB 硬扣**
#
#   所以 Xmx 不是"给 JVM 的堆"，而是 polars 眼里的"整机内存"，它再按比例分：
#     预留 12% + Spark 引擎 1GB + lake 写入/队列约 6.5%，剩下的才是计算内存。
#
#   Xmx=1024 时：
#     1024 - 122.9 - 1024 - 69.8 = -198.6 MB   ← 与报错值逐字节吻合
#
#   反过来解出下限：0.815 × Xmx > 1024（Spark 那 1GB）→ Xmx > 1256MB。
#   要留出 500MB 以上真实计算空间 → Xmx ≥ 1883MB。所以选 2048。
#   **这不是"11 万行用不着更大"，是引擎的分账模型不允许更小。**
#
#   另一个坑：worker 脚本的 DEFAULT_VM_OPTIONS 只设了
#   -Dio.grpc.netty.shaded...maxDirectMemory，没有 -XX:MaxDirectMemorySize，
#   于是直接内存默认等于 Xmx。显式写 2048M 是把这块也钉住，避免它随
#   Xmx 变动漂移。
#
# =============================================================================

# 独立的项目名。不写的话 compose 会按目录名（docker/）推断，于是和
# docker-compose.yml 撞成同一个项目 —— 两边每次 up 都会互相警告
# "Found orphan containers (rt-finebi)" / "(rt-flink-tm, rt-doris-be, …)"，
# 而且一个项目的 `down --remove-orphans` 会把另一个项目的容器当垃圾删掉。
name: rt-bi

services:

  # ===========================================================================
  # 引擎主节点：元数据 + 调度 + worker 注册中心
  # ===========================================================================
  finebi-master:
    image: bi-engine-master:6.1-20261016-6.1.11.1-tomcat-amd64-publish
    container_name: rt-finebi-master

    # 和 web 一样不自启 —— 切模式时靠脚本显式拉起，避免重启 Docker 后
    # 五个容器一起醒来抢内存。
    restart: "no"

    environment:
      TZ: Asia/Shanghai

      # 角色开关。镜像默认 Env 里已经是这个值，显式写一遍是防镜像升级后
      # 默认值变动（startup.sh 就是靠它分支到 runMaster / runWorker）。
      APP_TYPE: bi-engine-master

      # 必须写容器 IP，不能留默认的 127.0.0.1 —— 脚本会把它拼进
      # -Dpolars.cluster.role.net.host，绑到 loopback 的话 worker 永远连不上。
      POLARS_HOST: 172.28.0.31
      POLARS_PORT: "8000"

      # 元数据落盘位置（.polars_meta/polars.properties、conf、gc、dump 都在这下面）
      POLARS_HOME: /data/polars

      # 容器内必须前台运行，见 /opt/polars/start.sh 的 IS_CONTAINER 分支：
      # 容器里不能 nohup，否则 PID 1 立刻退出、容器秒退。
      IS_CONTAINER: "true"

      # 堆。master 只做调度和元数据，不扫数据，768MB 足够。
      # 脚本另有一行硬编码 -XX:MaxDirectMemorySize=2147483648（gRPC/Netty 用），
      # 那是上限不是预占，所以 mem_limit 给 2048m 而不是 768+2048。
      MASTER_EXTRA_VM_OPTIONS: "-Xmx768m"

      # 故意不设 OPS_URL —— 见文件头「四」。设了会多起一个 256MB 的监控 JVM。

    volumes:
      # master 的元数据卷。丢了这个卷不会丢业务数据（BI 的报表定义在 web 侧），
      # 只是集群重新初始化一遍。
      - rt-finebi-master:/data/polars

    networks:
      rt-net:
        ipv4_address: 172.28.0.31

    # 硬上限。master 只做调度 + 元数据，不扫数据：
    #   Xmx768 + 脚本写死的 -XX:MaxDirectMemorySize=2G（上限，不预占）+ 元空间/栈
    # 实测空载 398MB，给 2048 是留足 gRPC 突发。
    mem_limit: 2048m

    # 探 8000 端口而不是探进程名 —— pgrep 在这种精简镜像里不一定有，
    # bash 的 /dev/tcp 一定在。start_period 给足：要加载 357MB 的 jar。
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

  # ===========================================================================
  # 引擎工作节点：真正跑查询和数据加载
  # ===========================================================================
  # 它会起两个 JVM：
  #   PolarsMonitorServer  :9000  -Xmx256M  （看护者，会被 it 派生的 worker 挂掉后拉起）
  #   Worker               :9001  -Xmx1024M （干活的那个）
  finebi-worker:
    image: bi-engine-worker:6.1-20261016-6.1.11.1-tomcat-amd64-publish
    container_name: rt-finebi-worker

    restart: "no"

    # worker 要靠 master 的元数据注册，但**不用 depends_on 的 healthcheck 条件**：
    # 那会让 compose up 卡住等 master healthy，日志不友好；worker 自己有重试，
    # 由脚本按顺序起更直观（switch-mode.sh 会先起 master 再起 worker）。
    depends_on:
      finebi-master:
        condition: service_started

    environment:
      TZ: Asia/Shanghai

      APP_TYPE: bi-engine-worker

      POLARS_HOST: 172.28.0.32
      POLARS_PORT: "9001"

      POLARS_HOME: /data/polars
      IS_CONTAINER: "true"

      # 集群单 master 模式的三个坐标。名字要和 master 侧的 MASTER_NAME 对上
      # （默认都是 "Master"），host/port 是 master 容器的地址。
      ENV_MASTER_HOST: 172.28.0.31
      ENV_MASTER_PORT: "8000"
      ENV_MASTER_NAME: Master

      # 存储层。sync = 节点间直接传，不需要 MinIO。见文件头「三」。
      # 显式写出来是为了防止镜像将来把默认值改成 s3v2。
      ENV_POLARS_TIERS: sync

      # worker 的堆。**不能小**，原因见下面「为什么 2048 是下限」。
      WORKER_EXTRA_VM_OPTIONS: "-Xmx2048m -XX:MaxDirectMemorySize=2048M"

    volumes:
      - rt-finebi-worker:/data/polars

    # 硬上限。构成：
    #   worker  JVM   Xmx2048 + 堆外直连 2048（上限，实占远小于此）+ 元空间/栈 ≈ 2600
    #   monitor JVM   -Xmx256M（脚本写死）+ 堆外 ≈ 350
    #   两个 JVM 同容器，限额必须覆盖两者之和，给 3584 留余量。
    mem_limit: 3584m

    networks:
      rt-net:
        ipv4_address: 172.28.0.32

    # 探 worker 的 9001，不探 monitor 的 9000 —— 9000 活着不代表 worker 活着，
    # 恰恰是 worker 挂了才由 monitor 去拉，探它会给出假阳性。
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9001' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s

  # ===========================================================================
  # Web 入口：Tomcat + 页面 + 配置库 + spider 单机引擎（作为兜底）
  # ===========================================================================
  finebi:
    image: bi-web:6.1-20261016-6.1.11.1-tomcat-amd64-publish
    container_name: rt-finebi

    restart: "no"

    # HSQLDB 写 checkpoint 时被杀会留脏页，下次启动要做恢复。
    # 默认 10s 太短，和 mysql 那边同理给 60s。
    stop_grace_period: 60s

    ports:
      # 宿主 9080（8080 被大屏后端占着，别撞）
      - "${FINEBI_PORT:-9080}:8080"

    environment:
      TZ: Asia/Shanghai

      # ---------------------------------------------------------------------
      # JAVA_OPTS 必须整串重写，因为 docker 的 -e 是**替换**不是追加。
      # 镜像自带的串里没有 -Xmx —— 不给的话 JVM 走容器感知默认值
      # （MaxRAMPercentage 25%），等于把堆上限交给容器限额去推，不好控制。
      #
      # 为什么下面几乎照抄了镜像原串：实测过，缩减这些参数会让容器起不来。
      # 我按"节约"的思路压到 MaxMetaspace=512m / CodeCache=256m /
      # Direct=1024m / fineio.read=1，结果进程在 cluster 模块初始化后
      # 静默 exit 1（没有异常栈，FineLog 里也没业务日志，只有 gc/safepoint）。
      # 换成"厂商原串 + 只加 Xmx"就 25 秒 healthy。
      # 逐项二分太费时，且这些值本就是厂商按 746MB 的 WEB-INF/lib 算出来的，
      # 不与它较劲：**只加一个 Xmx 把堆钉住，其余照抄**。
      #
      # Xmx2560m 的依据：DWD 112,650 行 / DWS 88,157 行，2.5G 堆绰绰有余。
      # 官方"建议 8G ≤ Xmx"是按企业级并发和大表算的，本项目用不到；
      # 但要知道这是**低于官方下限**的选择，不是官方推荐配置，别对外这么说。
      # ---------------------------------------------------------------------
      JAVA_OPTS: >-
        -XX:+IgnoreUnrecognizedVMOptions
        -server
        -Duser.country=CN -Duser.language=zh -Djava.awt.headless=true
        -XX:PerBytecodeRecompilationCutoff=-1 -XX:PerMethodRecompilationCutoff=-1
        -Xms1024m -Xmx2560m
        -XX:MaxDirectMemorySize=2048M
        -XX:ReservedCodeCacheSize=1024m
        -XX:MaxMetaspaceSize=2048m
        -Dfineio.read_mem_limit=2 -Dfineio.write_mem_limit=1
        -Dsun.zip.disableMemoryMapping=true
        -XX:+UseParallelGC

    # 硬上限。超了 OOMKill，不会拖垮 Doris。
    # 7808 的下限来自 FineBI 的 JVM 参数自检：
    #   Xmx + MaxDirectMemory + MaxMetaspace + ReservedCodeCache
    #   = 2560 + 2048 + 2048 + 1024 = 7680，必须 ≤ 容器限额。
    # 不够就在部署向导页报「JVM参数配置存在问题」，比现在的引擎错误更靠前。
    # 7808 = 7680 + 128（给 Tomcat native、线程栈、mmap）。
    mem_limit: 7808m

    # -------------------------------------------------------------------------
    # 持久化：整个 webroot 挂一个命名卷
    # -------------------------------------------------------------------------
    # FineBI 会往十几个子目录写状态（embed 里的 HSQLDB 配置库、bi-data、
    # config、assets、plugins、dpworks、schedule、backup…），逐个挂卷太脆。
    # 挂整个 webroot 的代价是：镜像升级后旧卷里还是旧 jar，想更新得删卷重建。
    # 对"做个分析演示"这个用途，换来的"重启不丢工程"更值。
    #
    # 首次启动时 docker 会把镜像里的 webroot 复制进空卷（约 1.5GB），
    # 所以第一次 up 会慢 30~60 秒，之后正常。
    volumes:
      - rt-finebi-webroot:/usr/local/tomcat/webapps/webroot

    networks:
      rt-net:
        # 172.28.0.10~.21 已被数仓占，.30~.32 归 FineBI 三个容器。
        ipv4_address: 172.28.0.30

    # 镜像自带 healthcheck（/opt/fineops/bin/healthcheck.sh，5s 间隔 3 次重试），
    # 但没给 start_period —— 实测启动要 24 秒，前 15 秒必然连红 3 次被标 unhealthy。
    # 补一个 start_period 让它安静地启动。
    healthcheck:
      test: ["CMD-SHELL", "/opt/fineops/bin/healthcheck.sh"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 120s

networks:
  # 复用数仓那张网，FineBI 才能用 doris-fe:9030 这个服务名解析。
  # external: true 表示"这张网由别的 compose 管，我只接上去"，所以
  # 必须先起过一次数仓（至少 doris-fe / doris-be），否则这里会报网络不存在。
  rt-net:
    external: true
    name: rt-net

volumes:
  rt-finebi-webroot:
    name: rt-finebi-webroot

  # 引擎节点各自的元数据目录。不共享 —— polars 的 sync 模式靠节点间同步，
  # 共享磁盘反而会让两个进程抢同一份 .polars_meta。
  rt-finebi-master:
    name: rt-finebi-master

  rt-finebi-worker:
    name: rt-finebi-worker

  # 注：这里原本有个 rt-java11 卷（把 worker 镜像的 JDK 11 拷出来挂给 web），
  # 已删除。原因不是省空间，是那条路根本走不通：
  #   · entrypoint 硬拼 -XX:+PrintGCDateStamps（JDK 9 已移除）
  #   · FineAssist 是 JNI native agent，.so 按 Java 8 编，换 JDK 后随机
  #     ClassFormatError: Incompatible magic value
  #   · fine-core-11.0.jar 里 com/fr/plugin/bridge/*.classx 是厂商加密格式，
  #     Java 11 下解密封装失效，密文被当 class 读
  # 结论：bi-web 镜像**绑定 Java 8**，polars 引擎**绑定 Java 11**，
  # 这是两个进程而不是一个 JVM —— 也正因如此才有 master/worker 两个容器。
  # 完整复盘见 docs/note/27 §2.4。
