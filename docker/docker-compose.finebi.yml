# =============================================================================
# FineBI 6.1 —— 单容器分析模式（方案 D：与实时数仓二选一）
# -----------------------------------------------------------------------------
# 这个文件是独立的 compose，与 docker-compose.yml 互不影响：
#   起：docker compose -f docker-compose.finebi.yml up -d
#   停：docker compose -f docker-compose.finebi.yml down
# 用 scripts/switch-mode.sh 切换更省事（它会顺手算内存账）。
#
# 为什么只跑 bi-web 一个容器，不跑 finekey 那套 23 个镜像？
#
#   1. 那个 13GB 的包是 FineOps 企业版**集群**编排包，不是"一个 BI 镜像"。
#      官方最低配置方案是 16 核 / 64G 内存，且强制部署
#      1×bi-web + 1×bi-engine-master + 1×bi-engine-worker + 1×bi-minio，
#      外加 nginx / mysql 配置库 / es 日志存储。64G 是这台机器的 4 倍。
#
#   2. 官方最低档面向的是"日活 50 人、单表 500 万行、表数 500"的企业规模。
#      本项目 DWD 112,650 行、DWS 88,157 行，差了 45 倍，不需要那个架构。
#
#   3. bi-web 的 WEB-INF/lib 里有 fine-bi-engine-spider-6.1.jar —— 这是
#      **内置计算引擎**，本地就能算。polars 是另一套引擎（大数据量加速用），
#      拆在 bi-engine-master / bi-engine-worker 两个独立镜像里。
#
#   4. 6.1 而不是 7.5：7.x 把指标中心/引擎彻底服务化，官方没有单容器形态；
#      6.1 保留内置 spider 引擎，能单跑。这是选 6.1 的唯一理由。
#
#   5. **polars 引擎在 bi-web 里注定跑不起来，所以本项目把它整个移除**。
#      这不是偷懒，是实测出来的死结：
#        · bi-web 的单镜像只有 fine-bi-engine-polars-client（客户端）
#        · 真引擎 fine-bi-engine-polars-6.1.jar 在 worker 镜像里，341MB
#        · 那个 jar 是 **Java 11** 编译（class 55.0），而 bi-web 是 **Java 8**（52.0）
#        · 把 JDK 换成 11 又会崩另外三处：entrypoint 硬拼 JDK9 已移除的
#          -XX:+PrintGCDateStamps、FineAssist 的 JNI native agent 只认 Java 8、
#          fine-core-11.0.jar 里的 *.classx 加密类在 Java 11 下解不开
#        · 结论：bi-web 绑定 Java 8，polars 绑定 Java 11，同一个 JVM 装不下
#      完整复盘见 docs/note/27 §2.3–2.4。
#
#      **做法**：把 worker 里的 engine jar 移到 WEB-INF/lib.disabled/，
#      client 版也不放回，只留 spider 引擎。移完 25 秒 healthy、
#      /system/health 从 400 回到 200，所有 ClassFormatError 归零。
#      **卷重建后要重新移除一次**，命令见 docs/note/27 §3.2。
#
#      代价：polars 加速不可用。11 万行这个量级用 spider 没有实际影响。
#      真要上大数据量，正确做法是起官方的 master/worker 两容器（各自带 Java 11），
#      而不是把 Java 11 塞进 web。
#
# 内存账（详见 docs/note/27-FineBI-与内存预算.md）：
#   Docker VM 实见        9948 MB
#   doris-fe + doris-be   3328 MB   ← BI 模式保留，FineBI 要连它查数
#   本容器                7808 MB   ← 见下面「为什么是 7808」
#   --------------------------------
#   限额合计             11136 MB   ← 纸面超卖，靠实测余量兜底
#   实测占用              fe 657 + be 1514 + finebi 1586 = 3757 MB
#                         VM 内 MemAvailable 仍剩 5669 MB
#
# 「为什么是 7808」而不是最初写的 5632：
#
#   FineBI 自带启动自检，判据是
#       Xmx + MaxDirectMemorySize + MaxMetaspaceSize + ReservedCodeCacheSize
#       ≤ 容器内存
#   不满足就在部署向导页报红字「检测到1项配置异常：JVM参数配置存在问题」
#   「检测到 xmx + directMemory + metaspace + codecache > 容器/服务器分配的内存」。
#
#   厂商原串里这三项非堆参数是 2048 + 2048 + 1024 = 5120 MB，加 Xmx 2560
#   正好 7680 MB —— 所以容器限额的**下限就是 7680**，5632 数学上过不了。
#
#   厂商原串为什么原样保留（只加了 Xmx 和 IgnoreUnrecognizedVMOptions）：
#
#   这些值是厂商按 746MB 的 WEB-INF/lib 算出来的，压小省不出实际用量
#   （实测 Metaspace 只用 132MB、CodeCache 只用 18MB），却会把自检的四项和
#   压下去的同时也把安全余量压没了。既然最终选择是不动它们、只抬 mem_limit，
#   那就一个都不改。
#
#   7808 = 7680 + 128，多出的 128 给 Tomcat native、线程栈和 mmap。
#
# =============================================================================

# 独立的项目名。不写的话 compose 会按目录名（docker/）推断，于是和
# docker-compose.yml 撞成同一个项目 —— 两边每次 up 都会互相警告
# "Found orphan containers (rt-finebi)" / "(rt-flink-tm, rt-doris-be, …)"，
# 而且一个项目的 `down --remove-orphans` 会把另一个项目的容器当垃圾删掉。
name: rt-bi

services:

  finebi:
    image: bi-web:6.1-20261016-6.1.11.1-tomcat-amd64-publish
    container_name: rt-finebi

    # 不让它开机自启。BI 模式和 realtime 模式互斥，自启会抢内存。
    restart: "no"

    # HSQLDB 写 checkpoint 时被杀会留脏页，下次启动要做恢复。
    # 默认 10s 太短，和 mysql 那边同理给 60s。
    stop_grace_period: 60s

    ports:
      # 宿主 9080（8080 被大屏后端占着，别撞）
      - "${FINEBI_PORT:-9080}:8080"

    environment:
      TZ: Asia/Shanghai

      # ---------------------------------------------------------------------
      # JAVA_OPTS 必须整串重写，因为 docker 的 -e 是**替换**不是追加。
      # 镜像自带的串里没有 -Xmx —— 不给的话 JVM 走容器感知默认值
      # （MaxRAMPercentage 25%），等于把堆上限交给容器限额去推，不好控制。
      #
      # 为什么下面几乎照抄了镜像原串：实测过，缩减这些参数会让容器起不来。
      # 我按"节约"的思路压到 MaxMetaspace=512m / CodeCache=256m /
      # Direct=1024m / fineio.read=1，结果进程在 cluster 模块初始化后
      # 静默 exit 1（没有异常栈，FineLog 里也没业务日志，只有 gc/safepoint）。
      # 换成"厂商原串 + 只加 Xmx"就 25 秒 healthy。
      # 逐项二分太费时，且这些值本就是厂商按 746MB 的 WEB-INF/lib 算出来的，
      # 不与它较劲：**只加一个 Xmx 把堆钉住，其余照抄**。
      #
      # Xmx2560m 的依据：DWD 112,650 行 / DWS 88,157 行，2.5G 堆绰绰有余。
      # 官方"建议 8G ≤ Xmx"是按企业级并发和大表算的，本项目用不到；
      # 但要知道这是**低于官方下限**的选择，不是官方推荐配置，别对外这么说。
      #
      # 注意这四项是"上限"不是"预占"，实测空载只占 1.59 GB。
      # 但它们的**和** 2560 + 2048 + 2048 + 1024 = 7680 MB 正是 FineBI
      # 启动自检的判据，必须 ≤ 容器限额 —— mem_limit 因此定为 7808m。
      #
      # 第一行的 IgnoreUnrecognizedVMOptions 是为 Java 11 准备的：
      # /docker-entrypoint.sh 里硬拼了 -XX:+PrintGCDateStamps 和
      # -XX:+UseGCLogFileRotation（JDK 9 就移除了），不忽略的话 JVM 直接
      # "Unrecognized VM option" 起不来。加上它之后这两个参数被静默跳过，
      # 而 -Xloggc / -XX:+PrintGCDetails 在 Java 11 是 deprecated 别名，
      # 自动映射成 -Xlog:gc，GC 日志照常输出（实测，见 note/27 §2.7）。
      # ---------------------------------------------------------------------
      JAVA_OPTS: >-
        -XX:+IgnoreUnrecognizedVMOptions
        -server
        -Duser.country=CN -Duser.language=zh -Djava.awt.headless=true
        -XX:PerBytecodeRecompilationCutoff=-1 -XX:PerMethodRecompilationCutoff=-1
        -Xms1024m -Xmx2560m
        -XX:MaxDirectMemorySize=2048M
        -XX:ReservedCodeCacheSize=250M
        -XX:MaxMetaspaceSize=2048m
        -Dfineio.read_mem_limit=2 -Dfineio.write_mem_limit=1
        -Dsun.zip.disableMemoryMapping=true
        -XX:+UseParallelGC
        -XX:ReservedCodeCacheSize=1024m

    # 硬上限。超了 OOMKill，不会拖垮 Doris。
    # 7808 的下限来自 FineBI 的 JVM 参数自检（见文件头「为什么是 7808」）。
    # 1536 + 1792 + 7808 = 11136MB > VM 9948MB，属于**纸面超卖**：
    # mem_limit 是保险丝不是预占，实测三容器合计只用 3757MB。
    mem_limit: 7808m

    # -------------------------------------------------------------------------
    # 持久化：整个 webroot 挂一个命名卷
    # -------------------------------------------------------------------------
    # FineBI 会往十几个子目录写状态（embed 里的 HSQLDB 配置库、bi-data、
    # config、assets、plugins、dpworks、schedule、backup…），逐个挂卷太脆。
    # 挂整个 webroot 的代价是：镜像升级后旧卷里还是旧 jar，想更新得删卷重建。
    # 对"做个分析演示"这个用途，换来的"重启不丢工程"更值。
    #
    # 首次启动时 docker 会把镜像里的 webroot 复制进空卷（约 1.5GB），
    # 所以第一次 up 会慢 30~60 秒，之后正常。
    volumes:
      - rt-finebi-webroot:/usr/local/tomcat/webapps/webroot

      # ---------------------------------------------------------------------
      # 注意：这里**没有**挂 Java 11。
      #
      # 试过把 rt-java11 挂到 /opt/java/openjdk 覆盖镜像自带的 Java 8，
      # 结果一路踩坑，最后确认这条路不通：
      #   1. entrypoint 硬拼 -XX:+PrintGCDateStamps（JDK 9 已移除）→ JVM 起不来
      #      加 -XX:+IgnoreUnrecognizedVMOptions 可绕过
      #   2. FineAssist 是 JNI native agent（native int signature()），
      #      .so 按 Java 8 编译；加 -Djdk.attach.allowAttachSelf=true 让它
      #      attach 成功后，反而出现随机的 ClassFormatError
      #      （Incompatible magic value，每次数值和类名都不同）
      #   3. fine-core-11.0.jar 里有 com/fr/plugin/bridge/*.classx ——
      #      厂商的类加密格式，Java 11 下解密封装失效，密文被当 class 读
      #
      # 结论：bi-web 镜像是**绑定 Java 8** 的（类解密 + native agent 都依赖它），
      # 而 polars 引擎是 Java 11 编译的。厂商把两者拆成独立镜像不是选择，是必然。
      # 想回滚试 Java 11：把下面 rt-java11 那行加回来。
      # ---------------------------------------------------------------------
      # - rt-java11:/opt/java/openjdk

    networks:
      rt-net:
        # 172.28.0.10~.21 已被数仓占，.30 留给自己。
        # 固定 IP 是为了让接数据源时能写死 doris-fe:9030 之外还有个确定地址。
        ipv4_address: 172.28.0.30

    # 镜像自带 healthcheck（/opt/fineops/bin/healthcheck.sh，5s 间隔 3 次重试），
    # 但没给 start_period —— 实测启动要 24 秒，前 15 秒必然连红 3 次被标 unhealthy。
    # 补一个 start_period 让它安静地启动。
    healthcheck:
      test: ["CMD-SHELL", "/opt/fineops/bin/healthcheck.sh"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 120s

networks:
  # 复用数仓那张网，FineBI 才能用 doris-fe:9030 这个服务名解析。
  # external: true 表示"这张网由别的 compose 管，我只接上去"，所以
  # 必须先起过一次数仓（至少 doris-fe / doris-be），否则这里会报网络不存在。
  rt-net:
    external: true
    name: rt-net

volumes:
  rt-finebi-webroot:
    name: rt-finebi-webroot

  # Java 11 运行时，从 bi-engine-worker 镜像原样拷出（268MB）。
  #
  # external: true —— 这个卷不是 compose 造出来的，是手工准备的运行时。
  # 不加 external 的话 `down -v` 会把它一起删掉，下次启动就得重新拷 268MB。
  #
  # 丢了怎么重建（一条命令）：
  #   docker volume create rt-java11
  #   docker run --rm --entrypoint sh -v rt-java11:/dest \
  #     bi-engine-worker:6.1-20261016-6.1.11.1-tomcat-amd64-publish \
  #     -c 'cp -a /opt/java/openjdk/. /dest/'
  rt-java11:
    name: rt-java11
    external: true
