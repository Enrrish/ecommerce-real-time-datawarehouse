# =============================================================================
# 电商实时数仓 —— 容器编排
# -----------------------------------------------------------------------------
# 分三个 profile，按阶段起，不要一次全起（内存只有 10GB，见 docs/04 §4）：
#   source  : mysql + kafka        数据源
#   compute : flink-jobmanager/taskmanager
#   olap    : doris-fe + doris-be  单独起，BE 初始化会预占大块内存
#
# 常用命令（在 docker/ 目录下执行）：
#   docker compose --profile source up -d mysql      只起 MySQL
#   docker compose --profile source ps               看状态
#   docker compose --profile source logs -f mysql    看日志
#   docker compose --profile source down             停止（保留数据卷）
#   docker compose --profile source down -v          连数据一起删（慎用）
#
# 当前写了 mysql + kafka。flink / doris 等到各自阶段再加，避免堆一堆没验证过的配置。
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MySQL 8.0.36 —— 业务库（贴源层的源系统）
  # ---------------------------------------------------------------------------
  # 四个启动参数不是可选项，缺一个 CDC 就静默失效：
  #   binlog-format=ROW      记录行变更而非 SQL 文本，CDC 必需
  #   binlog-row-image=FULL  记录变更前后完整行，缺它拿不到 DELETE 前的值
  #   server-id=1            binlog 协议要求，集群内唯一
  #   log_bin                8.0 默认开启，此处不显式关，靠下面的校验确认
  # 另外 secure-file-priv 指向挂载的导入目录，LOAD DATA INFILE 才能读 /load 下的文件。
  mysql:
    image: mysql:8.0.36
    container_name: rt-mysql
    profiles: ["source"]
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root123}"
      MYSQL_DATABASE: olist
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --server-id=1
      - --innodb-buffer-pool-size=256M
      - --secure-file-priv=/load
      # 关掉客户端 LOCAL 上传通道：数据由 prepare_load.py 预处理好后走服务端读取，
      # 这样导入过程不依赖宿主机与容器的文件传输，也少一个安全面
      - --local-infile=0
    volumes:
      # 数据目录：必须在 D 盘的仓库内，否则 down 一次数据就没了
      - ./volumes/mysql:/var/lib/mysql
      # 首次初始化（数据目录为空时）自动执行建表脚本。
      # 单文件挂载 + 10- 前缀，确保只有 schema 会被执行；
      # 02-verify 和 03-load 是手动跑的，不能被 entrypoint 顺带执行。
      - ../sql/mysql/01-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      # 预处理后的 TSV 导入目录，对应 --secure-file-priv=/load
      #
      # 这里刻意不加 :ro —— 不是疏忽。MySQL 的 entrypoint 会解析
      # `mysqld --verbose --help` 的输出，把 secure-file-priv 指向的目录当作
      # 「必须属主为 mysql 的目录」，无条件执行 mkdir -p 后递归 chown：
      #   find "${!dirs[@]}" \! -user mysql -exec chown --no-dereference mysql '{}' +
      # 挂成只读时 chown 报 "Read-only file system"，而 entrypoint 头部是
      # `set -eo pipefail`，容器会在 mysqld 启动之前就以 exit 1 退出，
      # 日志里只有一行 Entrypoint started + 一屏 chown 报错，很难联想到是挂载选项。
      - ../build/load:/load
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    mem_limit: ${MYSQL_MEM_LIMIT:-768m}
    networks:
      rt-net:
        ipv4_address: 172.28.0.12

  # ---------------------------------------------------------------------------
  # Kafka 3.7.1 —— KRaft 单节点（不装 ZooKeeper，省一个容器和 1GB 内存）
  # ---------------------------------------------------------------------------
  # 两个 listener 不是多余配置。Kafka 返回给客户端的是 advertised 地址，
  # 客户端拿到后会**再连一次**，所以：
  #   - 容器内的客户端（Flink）必须拿到 kafka:9092，走 docker 网络
  #   - 宿主机上的客户端（Python 生成器）必须拿到 localhost:29092
  # 只配一个的话，必然有一边连不上，典型现象是「producer 连上了但一直超时，
  # 日志里出现 Connection to node -1 could not be established」。
  kafka:
    image: apache/kafka:3.7.1
    container_name: rt-kafka
    profiles: ["source"]
    restart: unless-stopped
    ports:
      # 只映射 EXTERNAL，9092 留在容器网络内，宿主机不暴露，避免误连
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 三个 partition：给 Flink 留并行度。按 session_id 做 key，
      # 同一会话的事件落在同一分区，分区内有序 —— 漏斗按 session 归因依赖这一点。
      KAFKA_NUM_PARTITIONS: 3
      # 关掉自动建 topic：topic 名打错时立刻报错，而不是悄悄建一个空 topic
      # 让人以为「生产成功了」
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 默认堆是 1G，会顶到 768m 的 cgroup 上限；显式压到 512m
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      TZ: Asia/Shanghai
    volumes:
      # 和 mysql 一样用 bind mount（实测 Docker Desktop 的 Windows 挂载是 0777，
      # appuser uid=1000 可写）。不用 named volume 是为了让数据目录都在仓库里，
      # 备份和查看都不用进 WSL。
      - ./volumes/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: ${KAFKA_MEM_LIMIT:-768m}
    networks:
      rt-net:
        ipv4_address: 172.28.0.13

  # ---------------------------------------------------------------------------
  # Flink 1.18.1 —— session 集群（JM + TM 分离）
  # ---------------------------------------------------------------------------
  # 三个 connector jar 必须**逐个文件**挂载到 /opt/flink/lib/，不能挂整个目录：
  #   挂目录会用宿主机的空目录覆盖镜像自带的 /opt/flink/lib（里面是 flink-dist、
  #   log4j 等核心包），结果是集群起来就报 ClassNotFoundException，且日志指向
  #   一个"找不到 org.apache.flink.runtime.taskexecutor.TaskManagerRunner"这种
  #   让人怀疑镜像坏了的错误。
  #
  # 镜像 tag 的 java11 后缀不是可选项：Flink 1.18 的 Scala 2.12 包在 Java 17 下
  # 会抛 ReflectiveOperationException（FLINK-34658），见 docs/04 §2。
  flink-jobmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: rt-flink-jm
    profiles: ["compute"]
    restart: unless-stopped
    command: jobmanager
    ports:
      - "${FLINK_WEB_PORT:-8081}:8081"
    environment:
      TZ: Asia/Shanghai
      # 整段配置用 FLINK_PROPERTIES 传，镜像的 entrypoint 会写进 flink-conf.yaml。
      # 注意 YAML 的 | 块里不能有制表符，缩进必须用空格。
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.memory.process.size: 768m
        taskmanager.numberOfTaskSlots: 10
        parallelism.default: 1
        # checkpoint 间隔就是数据对 Doris 的可见延迟上限：
        # Doris Connector 靠 checkpoint 触发 Stream Load 提交，不设的话
        # 数据会一直攒在内存里，表现为「作业 RUNNING 但 Doris 查不到数据」。
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.backend: rocksdb
        state.backend.incremental: true
        rest.flamegraph.enabled: true
        # 关掉 web 上传 jar：作业全部走 SQL Client 提交，少一个攻击面
        web.upload.enabled: false
    volumes:
      - ../flink/checkpoints:/opt/flink/checkpoints
      - ../flink/lib/flink-sql-connector-mysql-cdc-3.2.1.jar:/opt/flink/lib/flink-sql-connector-mysql-cdc-3.2.1.jar:ro
      - ../flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar:ro
      - ../flink/lib/flink-doris-connector-1.18-24.0.1.jar:/opt/flink/lib/flink-doris-connector-1.18-24.0.1.jar:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${FLINK_JM_MEM_LIMIT:-768m}
    networks:
      rt-net:
        ipv4_address: 172.28.0.20

  flink-taskmanager:
    image: flink:1.18.1-scala_2.12-java11
    container_name: rt-flink-tm
    profiles: ["compute"]
    restart: unless-stopped
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.numberOfTaskSlots: 10
        parallelism.default: 1
        execution.checkpointing.interval: 10s
        execution.checkpointing.mode: EXACTLY_ONCE
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.backend: rocksdb
        state.backend.incremental: true
        # TM 的堆外与托管内存必须显式给，否则 Flink 按容器总内存推算，
        # 在 cgroup 限制下容易算出负数直接启动失败。
        taskmanager.memory.process.size: 1536m
        taskmanager.memory.managed.size: 256m
        taskmanager.memory.network.min: 64m
        taskmanager.memory.network.max: 128m
    volumes:
      - ../flink/checkpoints:/opt/flink/checkpoints
      - ../flink/lib/flink-sql-connector-mysql-cdc-3.2.1.jar:/opt/flink/lib/flink-sql-connector-mysql-cdc-3.2.1.jar:ro
      - ../flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar:ro
      - ../flink/lib/flink-doris-connector-1.18-24.0.1.jar:/opt/flink/lib/flink-doris-connector-1.18-24.0.1.jar:ro
    mem_limit: ${FLINK_TM_MEM_LIMIT:-2560m}
    networks:
      rt-net:
        ipv4_address: 172.28.0.21

  # ---------------------------------------------------------------------------
  # Apache Doris 2.1.11 —— FE + BE
  # ---------------------------------------------------------------------------
  # 为什么要固定 IP 而不是用服务名：
  #   FE 启动时把 FE_SERVERS 里的地址写进元数据，BE 启动时把 BE_ADDR 注册给 FE。
  #   这两个地址会在**后续所有心跳与查询计划**中被复用。用 127.0.0.1 会指向
  #   容器自己（BE 永远 Alive: false）；用服务名则依赖 Docker 内置 DNS，
  #   在 FE 以 root 身份改写的配置文件里解析时机不确定。固定 IP 最稳。
  #   代价是子网不能和宿主机已有网段冲突 —— 172.28.0.0/24 是刻意选的，
  #   Windows 上常见的是 172.17~172.20（Docker 默认池）和 192.168.x。
  doris-fe:
    image: apache/doris:fe-2.1.11
    container_name: rt-doris-fe
    profiles: ["olap"]
    restart: unless-stopped
    environment:
      # 格式：<名字>:<IP>:<edit_log_port>，9010 是 FE 的元数据同步端口
      FE_SERVERS: fe1:172.28.0.10:9010
      FE_ID: "1"
      TZ: Asia/Shanghai
    ports:
      - "${DORIS_FE_HTTP_PORT:-8030}:8030"
      - "${DORIS_FE_QUERY_PORT:-9030}:9030"
    volumes:
      - ./volumes/doris-fe/doris-meta:/opt/apache-doris/fe/doris-meta
      - ./volumes/doris-fe/log:/opt/apache-doris/fe/log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8030/api/bootstrap >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: ${DORIS_FE_MEM_LIMIT:-1536m}
    networks:
      rt-net:
        ipv4_address: 172.28.0.10

  doris-be:
    image: apache/doris:be-2.1.11
    container_name: rt-doris-be
    profiles: ["olap"]
    restart: unless-stopped
    depends_on:
      - doris-fe
    environment:
      FE_SERVERS: fe1:172.28.0.10:9010
      # 格式：<IP>:<heartbeat_port>，9050 是 BE 向 FE 汇报的端口
      BE_ADDR: 172.28.0.11:9050
      TZ: Asia/Shanghai
    ports:
      - "${DORIS_BE_HTTP_PORT:-8040}:8040"
    volumes:
      - ./volumes/doris-be/doris-storage:/opt/apache-doris/be/storage
      - ./volumes/doris-be/log:/opt/apache-doris/be/log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8040/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: ${DORIS_BE_MEM_LIMIT:-2560m}
    networks:
      rt-net:
        ipv4_address: 172.28.0.11

# =============================================================================
# 网络
# -----------------------------------------------------------------------------
# 显式声明子网 + 每容器固定 IP。所有服务都接进来（包括 mysql / kafka），
# 否则 Flink 里的 'mysql:3306' / 'kafka:9092' 解析不到 —— 不同 network 之间
# 没有 DNS。
# =============================================================================
networks:
  rt-net:
    name: rt-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

